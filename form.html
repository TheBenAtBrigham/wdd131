<!DOCTYPE html>
<html lang="en">
<head>
    <script src="scripts/form.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Asa Benson">
    <meta name="description" content="WDD 131: Dynamic Web Fundamentals - Asa Benson: This is my index page for WWD 131 and contains some of my information.">
    <link rel="stylesheet" href="styles/form.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&family=Quicksand:wght@300..700&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&family=Yuji+Boku&display=swap" rel="stylesheet">
    <title>Product Review</title>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form method="get" action="review.html">
            <label for="product-name">Product Name</label>
            <select name="products" id="product-name" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>
            
            <h2>Overall Rating</h2>
            <div class="stars">
                <input type="radio" id="fivestar" name="stars" value="5" required><label for="fivestar"></label>
                <input type="radio" id="fourstar" name="stars" value="4" required><label for="fourstar"></label>
                <input type="radio" id="threestar" name="stars" value="3" required><label for="threestar"></label>
                <input type="radio" id="twostar" name="stars" value="2" required><label for="twostar"></label>
                <input type="radio" id="onestar" name="stars" value="1" required><label for="onestar"></label>
            </div>

            <label for="purchase-date">Date of Purchase</label>
            <input type="date" name="dates" id="purchase-date" required>
            
            <h2>Which did you find useful or great about this product? <span class="style">(Check all that apply)</span></h2>
            <div class="check">
                <input type="checkbox" id="durable" name="durablility"><label for="durable">Durability</label>
            </div>
            <div class="check">
                <input type="checkbox" id="ease" name="easy" value="Easy to use"><label for="ease">Easy</label>
            </div>
            <div class="check">
                <input type="checkbox" id="perform" name="performance" value="peformance"><label for="perform">Performance</label>
            </div>
            <div class="check">
                <input type="checkbox" id="design" name="designing" value="design"><label for="design">Design</label>
            </div>

            <label for="review">Written review (optional)</label>
            <textarea name="written-review" id="review"></textarea>

            <label for="name">Type your name (optional)</label>
            <input type="text" name="name-here" id="name" placeholder="Type your name here" autocomplete="on">

            <button id="submit" type="submit">Submit</button>

        </form>
    </main>
    <footer>
        <p>&copy;<span id="currentyear"></span> Asa Benson</p>
        <p><span id="lastModified"></span></p>
    </footer>
</body>
</html>
